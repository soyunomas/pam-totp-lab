name: PAM security verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libpam0g-dev \
            liboath-dev \
            libssl-dev \
            valgrind \
            binutils

      - name: Verify optional pam_totp_domains module
        run: |
          if [ -d pam_totp_domains ]; then
            chmod +x pam_totp_domains/verify.sh
            make -C pam_totp_domains verify
          fi

      - name: Verify optional pam_totp_shuffle module
        run: |
          if [ -d pam_totp_shuffle ]; then
            chmod +x pam_totp_shuffle/verify.sh
            make -C pam_totp_shuffle verify
          fi

      - name: Run complete repository verification gate
        run: make -C tests verify
