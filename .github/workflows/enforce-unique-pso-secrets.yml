name: Enforce unique schedule override secrets

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.actor == 'soyunomas' &&
      github.head_ref == 'feature/pam-schedule-totp-override' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pam-schedule-totp-override
          fetch-depth: 0

      - name: Enforce one secret per account
        run: python .github/scripts/enforce_unique_pso_secrets.py

      - name: Commit parser and test update
        run: |
          if git diff --quiet -- pam_schedule_totp_override; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pam_schedule_totp_override/schedule.c \
                  pam_schedule_totp_override/tests/test_schedule.c
          git commit -m "Exigir secretos docentes únicos por cuenta"
          git push origin HEAD:feature/pam-schedule-totp-override
