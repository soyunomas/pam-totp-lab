name: Cleanup schedule override branch

on:
  push:
    branches:
      - main
    paths:
      - .github/pso-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete merged feature branch
        run: git push origin --delete feature/pam-schedule-totp-override

      - name: Remove temporary cleanup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-pso-branch.yml .github/pso-cleanup-trigger
          git commit -m "ci: retirar limpieza temporal de schedule override"
          git push origin HEAD:main
