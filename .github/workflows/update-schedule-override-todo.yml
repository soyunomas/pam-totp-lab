name: Update schedule override TODO

on:
  workflow_run:
    workflows:
      - PAM security verification
    types:
      - completed
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/update-schedule-override-todo.yml

permissions:
  contents: write

jobs:
  update:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'pull_request' &&
       github.actor == 'soyunomas' &&
       github.head_ref == 'docs/schedule-totp-override' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Apply deterministic TODO patch
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/add_schedule_override_todo.py > /tmp/add_schedule_override_todo.py
          python /tmp/add_schedule_override_todo.py

      - name: Commit documentation update
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          if git diff --quiet -- TODO_AUTHENTICATION_IDEAS.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO_AUTHENTICATION_IDEAS.md
          git commit -m "docs: add schedule TOTP override proposal"
          git push origin "HEAD:${TARGET_BRANCH}"

# Controlled trigger for the documentation PR.
