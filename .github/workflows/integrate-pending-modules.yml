name: Integrate pending PAM modules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: >-
      github.event.action != 'closed' &&
      github.actor == 'soyunomas' &&
      github.head_ref == 'integration/all-modules' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/all-modules
          fetch-depth: 0

      - name: Import pending modules from their reviewed branches
        run: |
          set -euo pipefail
          if [ -e .github/integration-trigger ]; then
            git fetch origin \
              feature/pam-totp-domains \
              feature/pam-totp-shuffle
            git checkout origin/feature/pam-totp-domains -- pam_totp_domains
            git checkout origin/feature/pam-totp-shuffle -- pam_totp_shuffle
          fi

      - name: Canonicalize README and verify module inventory
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "| `pam_totp_domains` | PR #2 abierta | [PR #2](https://github.com/soyunomas/pam-totp-lab/pull/2) |":
              "| `pam_totp_domains` | Integrada en `main` | [README](./pam_totp_domains/README.md) |",
              "| `pam_totp_shuffle` | PR #3 abierta | [PR #3](https://github.com/soyunomas/pam-totp-lab/pull/3) |":
              "| `pam_totp_shuffle` | Integrada en `main` | [README](./pam_totp_shuffle/README.md) |",
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f"README row not found: {old}")
              text = text.replace(old, new)

          modules = [
              "pam-sandwich",
              "pam_strict_totp",
              "pam_totp_domains",
              "pam_totp_shuffle",
              "pam_totp_slot_challenge",
              "pam_chronoguard",
              "pam_partial_key",
              "pam_school_schedule",
              "pam_2man_totp",
          ]
          missing_dirs = [name for name in modules if not Path(name).is_dir()]
          missing_docs = [name for name in modules if f"`{name}`" not in text]
          if missing_dirs or missing_docs:
              raise SystemExit(
                  f"inventory mismatch: dirs={missing_dirs}, readme={missing_docs}"
              )

          path.write_text(text, encoding="utf-8")
          Path(".github/integration-trigger").unlink(missing_ok=True)

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libpam0g-dev \
            liboath-dev \
            libssl-dev \
            valgrind \
            binutils

      - name: Verify imported modules with concise diagnostics
        run: |
          set +e
          for module in pam_totp_domains pam_totp_shuffle
          do
            chmod +x "$module/verify.sh"
            make -C "$module" verify > "/tmp/${module}.log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo "## Fallo de verificación en \`$module\`"
                echo
                echo '```text'
                tail -n 120 "/tmp/${module}.log"
                echo '```'
              } > /tmp/verification-comment.md
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/verification-comment.md
              cat /tmp/verification-comment.md
              exit "$status"
            fi
          done

      - name: Commit integrated modules
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md pam_totp_domains pam_totp_shuffle
          git commit -m "Integrar pam_totp_domains y pam_totp_shuffle"
          git push origin HEAD:integration/all-modules

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'integration/all-modules' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close superseded pull requests
        run: |
          gh pr close 2 --repo "$GITHUB_REPOSITORY" --comment "Contenido integrado y verificado mediante la PR de consolidación." || true
          gh pr close 3 --repo "$GITHUB_REPOSITORY" --comment "Contenido integrado y verificado mediante la PR de consolidación." || true

      - name: Delete secondary branches
        run: |
          for branch in \
            feature/pam-totp-domains \
            feature/pam-totp-shuffle \
            feature/pam-totp-slot-challenge \
            docs/schedule-totp-override \
            integration/all-modules
          do
            git push origin --delete "$branch" || true
          done

      - name: Remove temporary integration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-pending-modules.yml
          git commit -m "ci: remove temporary integration workflow"
          git push origin HEAD:main
